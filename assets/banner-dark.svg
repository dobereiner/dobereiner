<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Abstract modernist banner in charcoal, olive, ivory, and ochre">
  <defs>
    <pattern id="fine-lines" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#E8E0CF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
